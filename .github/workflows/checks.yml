name: GradeGuard checks

on:
  push:
    branches: ['feature/**', 'bugfix/**', 'hotfix/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests including native Tk workflows
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run calculation audit
        run: python tests/calculation_audit.py --report audit-results.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculation-audit
          path: audit-results.json
